name: Actualizar datos del catálogo

# Regenera site/data/games.json y descarga escaneos nuevos. Se lanza a mano
# o una vez al mes; si hay cambios, los commitea en la rama actual.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 1 * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python3 scripts/build_data.py
      - run: python3 scripts/fetch_scans.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data site/scans
          git diff --cached --quiet || git commit -m "Actualizar datos del catálogo"
          git push
